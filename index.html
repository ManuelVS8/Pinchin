function mergeProg(a,b){
  const m=JSON.parse(JSON.stringify(a)),x=b||{},mx=(p,q)=>Math.max(+p||0,+q||0),mn=(p,q)=>{p=+p||0;q=+q||0;return p&&q?Math.min(p,q):(p||q);};
  const la=m.level||1,lb=x.level||1;
  if(lb>la||(lb===la&&(x.xp||0)>(m.xp||0))){m.level=lb;m.xp=x.xp||0;}
  ['med','plays'].forEach(k=>{m[k]=m[k]||MED0();const xo=x[k]||{};for(const h in xo){m[k][h]=m[k][h]||{};for(const md in xo[h]){m[k][h][md]=m[k][h][md]||{};for(const l in xo[h][md])m[k][h][md][l]=mx(m[k][h][md][l],xo[h][md][l]);}}});
  ['owned','achievements'].forEach(k=>{const st=new Set(m[k]||[]);(x[k]||[]).forEach(v=>st.add(v));m[k]=[...st];});
  m.stats=m.stats||{};for(const f in (x.stats||{}))if(typeof x.stats[f]==='number')m.stats[f]=mx(m.stats[f],x.stats[f]);
  ['fut','bball'].forEach(k=>{m[k]=m[k]||{};const xo=x[k]||{};['saves','baskets','games'].forEach(f=>{if(f in xo||f in m[k])m[k][f]=mx(m[k][f],xo[f]);});
    m[k].best=m[k].best||{};const xb=xo.best||{};['m','n'].forEach(md=>{m[k].best[md]=mn(m[k].best[md],xb[md]);});});
  m.cesta=m.cesta||{};for(const f in (x.cesta||{}))m.cesta[f]=mx(m.cesta[f],x.cesta[f]);
  ['celebStadium','celebTrophy'].forEach(k=>{if(x[k]&&!m[k])m[k]=x[k];});
  if(x.week){if(!m.week)m.week=JSON.parse(JSON.stringify(x.week));else if(x.week.k===m.week.k){m.week.xp=mx(m.week.xp,x.week.xp);['fm','fn','bm','bn'].forEach(f=>{m.week[f]=mn(m.week[f],x.week[f]);});}}
  if(x.streak&&m.streak&&(x.streak.last||'')>(m.streak.last||''))m.streak=x.streak;
  return m;
}

async function cloudSync(o={}){
  if(!cloudLinked()||cloudBusy)return null;
  cloudBusy=true;let r=null,adoptedNow=false;
  try{
    const fresh=!S.name&&!o.force;   // mascota sin nacer: solo se descarga, nunca se sube
    if(!fresh&&cloudSig===null&&!o.keep&&!o.force){
      const pr=await cloudCallR(Object.assign({a:'sync'},auth()),{ms:o.ms});
      if(!pr){cloudErr=true;return null;}
      cloudErr=false;
      if(!pr.ok){if(pr.err==='login'||pr.err==='locked'){cloudErr=pr.err;if(!o.login&&!cloudWarned){cloudWarned=true;toast('☁️ No se pudo entrar en tu cuenta. Mira en Ajustes');}}return pr;}
      if(pr.name&&CC.n!==pr.name){CC.n=pr.name;cloudStore();}
      cloudGod=pr.mode==='todo';godShow();
      if(pr.data){let ro=null;try{ro=JSON.parse(pr.data);}catch(e){}
        if(ro){if(o.login||cloudAllowed()){cloudAdopt(mergeIn(ro));cloudSig=null;adoptedNow=true;cloudPending=false;}else{cloudPending=true;return pr;}}}
    }
    if(CC&&S.acct!==acctOf(CC))S.acct=acctOf(CC);
    const sig=cloudSigOf(),dirty=!fresh&&(!!o.force||cloudSig===null||sig!==cloudSig);
    const body=Object.assign({a:'sync'},auth());
    if(dirty){
      const w=wk();body.data=JSON.stringify(S);body.prog=progOf(S);body.force=!!o.force;
      body.sum={coins:S.coins,level:S.level,med:nMedals(),wk:w.k,fm:S.fut.best.m,fn:S.fut.best.n,bm:S.bball.best.m,bn:S.bball.best.n,wfm:w.fm,wfn:w.fn,wbm:w.bm,wbn:w.bn};
    }
    r=await cloudCallR(body,{keep:o.keep,ms:o.ms});
    if(!r){cloudErr=true;return null;}
    cloudErr=false;
    if(!r.ok){if(r.err==='login'||r.err==='locked'){cloudErr=r.err;if(!o.login&&!cloudWarned){cloudWarned=true;toast('☁️ No se pudo entrar en tu cuenta. Mira en Ajustes');}}return r;}
    if(r.name&&CC.n!==r.name){CC.n=r.name;cloudStore();}
    if(r.saved){cloudSig=sig;cloudLast=Date.now();cloudPending=false;}
    else if(r.data){
      const ro=JSON.parse(r.data),rp=progOf(ro),lp=progOf(S);
      if(rp>lp||fresh){
        if(o.login||cloudAllowed()){cloudAdopt(fresh?mergeProg(ro,{}):mergeIn(ro));if(!fresh)cloudSig=null;cloudPending=false;r.adopted=true;cloudLast=Date.now();}
        else cloudPending=true;
      }else if(rp<lp)cloudSig=null;else{cloudSig=sig;cloudLast=Date.now();}
    }else cloudSig=sig;
    cloudGod=r.mode==='todo';godShow();if(cloudGod)godKeep();
    if(adoptedNow)r.adopted=true;
    return r;
  }catch(e){cloudErr=true;return r;}
  finally{cloudBusy=false;}
}

}

const LOCK_K='pinchin-lock';
const lockLeft=()=>{try{const o=JSON.parse(localStorage.getItem(LOCK_K)||'{}');return Math.max(0,Math.ceil(((o.until||0)-Date.now())/1000));}catch(e){return 0;}};

function openCloudLogin(done){
  const fin=()=>{closePanel();if(done)done();};
  let sel=[],busyL=false;
  openPanel(`<div class="ghead"><b>Elige la combinación</b><button class="spk2" id="lSay">🔊</button><button class="x" id="lX">✕</button></div>
    <div class="lslots" id="lSlots"></div><div class="lgrid" id="lGrid"></div>
    <div class="lbtns"><button class="btn" id="lDel" aria-label="Borrar">❌</button><button class="btn primary" id="lOk" aria-label="Aceptar">✔</button></div>
    <div class="gmsg" id="lMsg"></div>`,'',fin);
  const slots=()=>{$('#lSlots').innerHTML=[0,1,2].map(i=>`<div>${sel[i]||''}</div>`).join('');};slots();
  const say=()=>hablar('Elige la combinación.');say();$('#lSay').onclick=()=>hablarYa(say);$('#lX').onclick=fin;
  const msg=t=>{const m=$('#lMsg');if(m)m.textContent=t;};
  const wl=lockLeft();if(wl)msg(`🔒 Espera ${wl} s`);
  // las frutas cambian de sitio cada vez que se abre y tras cada intento
  const mix=()=>{const g=$('#lGrid');if(!g)return;let o;const prev=g.dataset.o||'';do{o=shuffle(LOGIN_FR.slice());}while(o.join('')===prev);g.dataset.o=o.join('');
    g.innerHTML=o.map(f=>`<button class="lf" data-f="${f}">${f}</button>`).join('');
    $$('#lGrid .lf').forEach(b=>b.onclick=()=>{if(sel.length>=3)return;sel.push(b.dataset.f);sfx('pop');slots();});};
  mix();
  $('#lDel').onclick=()=>{sel=[];sfx('click');slots();msg('');};
  const fail=()=>{lockFail();sfx('bad');const s=$('#lSlots');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');hablar('Prueba otra vez.');sel=[];setTimeout(()=>{slots();mix();},500);const w=lockLeft();msg(w?`🔒 Espera ${w} s`:'');};
  $('#lOk').onclick=async()=>{
    if(busyL)return;const w=lockLeft();if(w){msg(`🔒 Espera ${w} s`);sfx('bad');return;}
    if(sel.length<3){hablar('Elige tres frutas.');sfx('bad');return;}
    if(!(sel[0]===sel[1]&&sel[1]===sel[2])){fail();return;}
    busyL=true;msg('⏳');const r=await cloudCallR({a:'clase',f:sel[0]},{ms:12000});busyL=false;
    if(!r||r.err==='server'){msg(netMsg(r));return;}
    if(!r.ok){if(r.err==='locked'){msg('🔒 Demasiados intentos. Espera unos minutos.');sfx('bad');return;}fail();return;}

/* ---------- PWA: actualizaciones, splash e instalación ---------- */
const APP_VERSION=(document.querySelector('meta[name="app-version"]')||{}).content||'0';
const isNewer=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i]||0,q=y[i]||0;if(p!==q)return p>q;}return false;};
let lastCheck=0,updShown=false;
async function checkUpdate(manual,onSplash){
  if(!/^https?:$/.test(location.protocol)){if(manual)toast('Las actualizaciones solo funcionan en la web publicada');return;}
  const now=Date.now();if(!manual&&!onSplash&&now-lastCheck<20000)return;lastCheck=now;
  try{
    // El parámetro nocache evita la caché del navegador, la de GitHub Pages y la del service worker
    const r=await fetch(location.pathname+'?nocache='+now,{cache:'no-store'});
    const m=(await r.text()).match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&isNewer(m[1],APP_VERSION)){if(onSplash&&$('#splash')&&!justUpdated)autoUpdate(m[1]);else showUpdate(m[1]);}
    else if(manual)toast('✅ Ya tienes la última versión');
  }catch(e){if(manual)toast('Sin conexión: no se puede comprobar ahora');}
}
// En la pantalla de inicio se actualiza sola, sin preguntar
async function autoUpdate(v){
  const b=$('#spBtns');if(b)b.innerHTML=`<div class="spHint">⏳ Actualizando…</div>`;
  splashReady=false;save();
  try{const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('pinchin-')).map(k=>caches.delete(k)));}catch(e){}
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
}
function showUpdate(v){
  if(updShown)return;updShown=true;
  const b=document.createElement('div');b.id='updBar';
  b.innerHTML=`🎉 Hay una actualización<button id="updGo">Actualizar</button><button class="no" id="updNo">Luego</button>`;
  document.body.appendChild(b);
  $('#updNo').onclick=()=>{b.remove();updShown=false;lastCheck=Date.now()+30*60000;};
  $('#updGo').onclick=async()=>{
    save();b.innerHTML='⏳ Actualizando…';
    try{const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('pinchin-')).map(k=>caches.delete(k)));}catch(e){}
    try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(e){}
    location.replace(location.pathname+'?v='+Date.now());
  };
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false);});
setInterval(()=>checkUpdate(false),15*60000);
// Si acabamos de actualizar (?v=…), no se vuelve a actualizar sola en esta carga: así nunca entra en bucle
// Se calcula ANTES de limpiar la URL (si no, ?pwa=1 ya no existe y nunca se detecta la app instalada)
const LANZADA_COMO_APP=(()=>{const f=/[?&]pwa=1/.test(location.search);try{if(f)sessionStorage.setItem('pinchinApp','1');return sessionStorage.getItem('pinchinApp')==='1';}catch(e){return f;}})();
const justUpdated=/[?&]v=\d+/.test(location.search);
if(/[?&](v=\d+|pwa=1)/.test(location.search))history.replaceState(null,'',location.pathname);

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
}
// Instalable desde el menú del navegador (Chrome: ⋮ → Instalar). Si el navegador ofrece su botón, se muestra.
// Solo cuenta como "app instalada" si se lanzó desde su propio icono (start_url con ?pwa=1).
// Si se abre desde un enlace dentro de otra PWA (p. ej. siurot.net), el navegador también dice "standalone", pero esta app NO está instalada.
const isStandalone=()=>LANZADA_COMO_APP&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if($('#splash'))renderSplashBtns();else showInstallBar();});
window.addEventListener('appinstalled',()=>{installEvt=null;const b=$('#instBar');if(b)b.remove();});

let splashReady=false;
function showSplash(){
  const s=document.createElement('div');s.id='splash';
  s.innerHTML=`<div class="spPet"></div><div class="spTitle">La casa de<br>Pinchín</div><div class="spSub">Suma y resta con frutas 🍎</div>${DEDIC?`<div class="spDed">${DEDIC}</div>`:''}<div class="spBtns" id="spBtns"><div class="spBar"><i></i></div></div><div class="spBy">Creado por Manuel J. Ventura</div>`;
  document.body.appendChild(s);
  const box=s.querySelector('.spPet');
  if(firstRun)box.innerHTML=EGG_SVG;else box.appendChild(cleanClone());
  checkUpdate(false,true);
  setTimeout(()=>{if($('#spBtns')&&!/Actualizando/.test($('#spBtns').textContent)){splashReady=true;renderSplashBtns();}},1300);
}
async function doInstall(){
  const e=installEvt;if(!e)return;
  installEvt=null;const bar=$('#instBar');if(bar)bar.remove();
  try{e.prompt();const r=await e.userChoice;if(r.outcome==='accepted')toast('¡Instalada! Ya la tienes en tu pantalla de inicio 📲');}catch(_){}
}
function showInstallBar(){
  if(isStandalone()||$('#instBar')||sessionStorage.getItem('noInstallBar'))return;
  const b=document.createElement('div');b.id='instBar';
  b.innerHTML=`📲 ¿Instalar Pinchín?<button id="ibGo">Instalar</button><button class="no" id="ibNo">✕</button>`;
  document.body.appendChild(b);
  $('#ibGo').onclick=doInstall;
  $('#ibNo').onclick=()=>{b.remove();try{sessionStorage.setItem('noInstallBar','1');}catch(_){}};
}
function renderSplashBtns(){
  const b=$('#spBtns');if(!b||!splashReady)return;
  b.innerHTML=`<button class="spBtn primary" id="spGo">▶ ¡A jugar!</button>${cloudOn&&!cloudLinked()?'<button class="spBtn link" id="spCloud">☁️ Entrar con mi nombre</button>':''}${installEvt&&!isStandalone()?'<button class="spBtn link" id="spInstall">📲 Instalar la app</button>':''}`;
  const cb=$('#spCloud');if(cb)cb.onclick=()=>{closeSplash(true);openCloudLogin(()=>startApp());};
  $('#spGo').onclick=()=>{ensureAudio();fartDecode();hablar(firstRun?'¡Hola!':'¡Hola de nuevo!');closeSplash();};
  const ib=$('#spInstall');if(ib)ib.onclick=async()=>{closeSplash(true);await doInstall();startApp();};
}
let appStarted=false;
function closeSplash(noStart){
  ensureAudio();sfx('pop');
  const s=$('#splash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),500);}
  if(noStart!==true)startApp();
}
async function startApp(){
  if(appStarted)return;appStarted=true;
  if(firstRun&&cloudLinked()){await new Promise(r=>setTimeout(r,Math.random()*1500));await cloudSync({login:true,ms:7000});}
  if(firstRun||!S.name)welcome();else setTimeout(()=>say(S.sleeping?'Zzz…':SEASON_HELLO[season()]||(isEvening()?'¡Buenas noches! 🌙':'¡Hola de nuevo! 👋'),3500),400);
}
if(DIAG)showDiag();else showSplash();
})();
</script>
