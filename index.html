<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La casa de Pinchín</title>
<meta name="app-version" content="1.0.9">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b2a1e">
<meta name="description" content="Cuida a Pinchín y aprende a sumar y restar jugando con frutas">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pinchín">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pet:#9b8cf2;--pet-dark:#7a69d6;--pet-light:#d9d2ff;
  --ink:#2b2340;--bg:#f4efe6;--accent:#ff8a3d;--ok:#2fbf71;--bad:#ef5350;--gold:#ffc93c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'Fredoka','Segoe UI',system-ui,sans-serif;color:var(--ink);background:#2b2340;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;height:var(--appH,100dvh);max-width:1000px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

/* Cabecera */
#top{padding:8px 10px 8px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.05);z-index:2}
.row{display:flex;align-items:center;gap:8px}
.chip{border:none;background:#f3eefc;border-radius:999px;padding:6px 12px;font-size:17px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip b{font-weight:600}
.right{margin-left:auto;display:flex;gap:6px}
.xpbar{width:46px;height:7px;background:#e3dbf5;border-radius:9px;overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--gold);width:0}
#petName{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#needs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.need{border:none;background:#f7f4fb;border-radius:12px;padding:5px 8px;display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
.ni{font-size:22px;line-height:1}
.nb{flex:1;height:11px;background:#e7e1f0;border-radius:9px;overflow:hidden}
.nb i{display:block;height:100%;width:50%;transition:width .5s,background .5s;border-radius:9px}
.need.low{animation:pulse 1s infinite}
@keyframes pulse{50%{background:#ffe0df}}

/* Escenario */
#stage{position:relative;flex:1;overflow:hidden;min-height:0;container-type:size}
.wall{position:absolute;inset:0 0 28% 0;transition:background .4s}
.floor{position:absolute;left:0;right:0;bottom:0;height:28%;transition:background .4s}
.room-cocina .wall{background:#ffe3c2}
.room-cocina .floor{background:repeating-conic-gradient(#f2cfa0 0 25%,#e6b983 0 50%) 0 0/48px 48px}
.room-bano .wall{background:#d4f0fb;background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px);background-size:44px 44px}
.room-bano .floor{background:#8fcde6}
.room-dormitorio .wall{background:#e3dcff}
.room-dormitorio .floor{background:repeating-linear-gradient(90deg,#c99a6b 0 60px,#b9895a 60px 63px)}
.room-juegos .wall{background:#d8f5d0;background-image:radial-gradient(#bfe9b3 3px,transparent 4px);background-size:34px 34px}
.room-juegos .floor{background:#8fd37f}
#decor .deco{position:absolute;pointer-events:none;line-height:1}
#roomTitle{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.8);padding:4px 12px;border-radius:999px;font-weight:600;z-index:3;font-size:16px}

#petWrap{position:absolute;left:var(--px,50%);bottom:6%;transform:translateX(-50%);width:calc(min(62vw,46vh,340px)*var(--grow,1));width:calc(min(78cqw,62cqh,360px)*var(--grow,1));aspect-ratio:1;z-index:3;transition:left 2.2s ease-in-out,width .8s ease}
#petFx{width:100%;height:100%;transform-origin:50% 100%}
#petSvg .ft1{transform-box:fill-box;transform-origin:70% 50%;transition:transform .25s ease-out}
#petSvg.fartpose .ft1{opacity:0}
.gas circle{opacity:0;fill:#c3cf72;transform-box:fill-box;transform-origin:center}
#petSvg.fartgas .gas circle{animation:gasp 1.4s ease-out forwards}
#petSvg.fartgas .gas circle:nth-child(2){animation-delay:.12s}
#petSvg.fartgas .gas circle:nth-child(3){animation-delay:.25s}
#petSvg.fartgas .gas circle:nth-child(4){animation-delay:.38s}
@keyframes gasp{0%{opacity:.9;transform:translate(0,0) scale(.35)}100%{opacity:0;transform:translate(-62px,-16px) scale(1.9)}}
#petFx.fartlean{transform-origin:62% 100%;animation:fartlean 2.3s ease-in-out}
@keyframes fartlean{0%{transform:rotate(0)}15%,80%{transform:rotate(8deg) translateX(6px)}100%{transform:rotate(0)}}
.snotb{display:none;fill:rgba(180,225,255,.8);stroke:#fff;stroke-width:1.5;transform-box:fill-box;transform-origin:center}
#petSvg.snot .snotb{display:block;animation:snotg 2.4s ease-in-out forwards}
@keyframes snotg{0%{transform:scale(.2)}25%{transform:scale(.9)}45%{transform:scale(.45)}75%{transform:scale(1.6)}100%{transform:scale(1.8);opacity:0}}
.stink{display:none;fill:none;stroke:#8bc34a;stroke-width:4;stroke-linecap:round}
#petSvg.stinkon .stink{display:block}
#petSvg.stinkon .stink path{animation:stk 1.1s ease-in-out infinite}
#petSvg.stinkon .stink path:nth-child(2){animation-delay:.25s}
#petSvg.stinkon .stink path:nth-child(3){animation-delay:.5s}
@keyframes stk{0%,100%{transform:translateY(5px);opacity:.25}50%{transform:translateY(-6px);opacity:1}}
.headfly{transform-box:fill-box;transform-origin:center}
#petSvg.flyland .headfly{animation:hfl .3s ease-in-out infinite alternate}
@keyframes hfl{from{transform:translate(-7px,0) rotate(-14deg)}to{transform:translate(7px,-2px) rotate(14deg)}}
#eyesOpen.lookup{transform:translateY(-7px)}
#petFx.nod{animation:nodq 2.6s ease-in-out}
@keyframes nodq{0%{transform:rotate(0)}30%,42%{transform:rotate(7deg) translateY(5px)}50%{transform:rotate(-2deg)}58%,66%{transform:rotate(8deg) translateY(6px)}72%{transform:rotate(0) translateY(-6px)}100%{transform:rotate(0)}}
#petFx.spin{animation:spinq 1s ease-in-out}
@keyframes spinq{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#petFx.scratch{animation:scrq .9s ease-in-out}
@keyframes scrq{0%,100%{transform:rotate(0)}15%{transform:rotate(-5deg)}30%{transform:rotate(4deg)}45%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-3deg)}}
#petFx.press{animation:prsq 2.2s ease-in-out}
@keyframes prsq{0%,100%{transform:scale(1)}20%,80%{transform:scale(1.28,1.12) translateY(-6px)}}
#petFx.shake{animation:shkq .1s linear 11}
@keyframes shkq{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#petFx.squish{animation:squish .35s ease}
#petFx.wobble{animation:wobble .5s ease-in-out infinite}
#petBob{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
#stage.sleeping #petBob{animation-duration:4.5s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.01,.99)}}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}
#petFx.jump{animation:jump .7s ease}
#petFx.walking{animation:waddle .45s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-38px) scale(1.04,.96)}55%{transform:translateY(0) scale(1.08,.9)}70%{transform:translateY(-12px)}}
@keyframes waddle{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4px)}}
#stage.evening .wall{filter:brightness(.82) saturate(.9)}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
#petSvg{width:100%;height:100%;display:block;touch-action:none;cursor:pointer;overflow:visible}
#stage.soapmode #petSvg{cursor:grab}
.c-main{fill:var(--pet)}.c-dark{fill:var(--pet-dark)}.c-light{fill:var(--pet-light)}
.starb{fill:var(--pet);stroke:var(--pet);stroke-width:18;stroke-linejoin:round}
.line{fill:none;stroke:#2b2340;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.lash{fill:none;stroke:#2b2340;stroke-width:3;stroke-linecap:round}
.cheek{fill:#ff8fb1;opacity:.55;transition:fill .4s}
svg.sick .cheek{fill:#9ccc65;opacity:.85}
.tuft{fill:none;stroke:var(--pet-dark);stroke-width:6;stroke-linecap:round}
.tail{fill:none;stroke:var(--pet-dark);stroke-width:13;stroke-linecap:round}
.whisk path{stroke:#2b2340;stroke-width:2.5;stroke-linecap:round;opacity:.6}
.mouthO{fill:#6b1f3a}
.shadow{fill:rgba(0,0,0,.13)}
.dirt{fill:#7a5a35;opacity:.5}
.bub{fill:rgba(255,255,255,.88);stroke:#8fd3ff;stroke-width:1.5}
.hide{display:none}
#eyesOpen{transform-box:fill-box;transform-origin:center;transition:transform .07s}
#eyesOpen.blink{transform:scaleY(.08)}
.wig{animation:wig .35s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

#bubble{position:absolute;left:var(--px,50%);transition:left 2.2s ease-in-out;bottom:calc(6% + min(62vw,46vh,340px)*var(--grow,1) - 4px);bottom:calc(6cqh + min(78cqw,62cqh,360px)*var(--grow,1) - 4px);transform:translateX(-50%);background:#fff;padding:8px 16px;border-radius:18px;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;max-width:84%;text-align:center;font-weight:500}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fff;border-bottom:0}
#bubble.popin{animation:popin .25s ease}
@keyframes popin{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx{position:absolute;transform:translate(-50%,-50%);font-size:30px;font-weight:700;pointer-events:none;animation:up 1.3s ease-out forwards;white-space:nowrap;color:#e2468a}
@keyframes up{from{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-170%) scale(1.1)}}
#night{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 80% 14%,rgba(255,255,200,.28),transparent 22%),rgba(14,12,48,.72)}
#night.on{opacity:1}
#water{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(110,190,255,.55) 22px 25px);background-size:100% 200%}
#water.on{opacity:1;animation:rain .3s linear infinite}
@keyframes rain{to{background-position:0 100%}}
#poop{position:absolute;left:13%;bottom:8%;font-size:46px;line-height:1;z-index:3;pointer-events:none;display:none}
#poop.on{display:block}
#poop i{position:absolute;left:50%;top:40%;font-style:normal;font-size:20px}
#poop i:nth-child(1){animation:pf1 1.7s linear infinite}
#poop i:nth-child(2){animation:pf2 2.3s linear infinite}
@keyframes pf1{0%,100%{transform:translate(-30px,-30px)}25%{transform:translate(10px,-50px)}50%{transform:translate(28px,-14px)}75%{transform:translate(-6px,-6px)}}
@keyframes pf2{0%,100%{transform:translate(24px,-44px)}33%{transform:translate(-26px,-20px)}66%{transform:translate(4px,-58px)}}
#flies{position:absolute;inset:0;pointer-events:none;z-index:4;display:none}
#flies.on{display:block}
#flies span{position:absolute;left:50%;top:55%;font-size:22px}
#flies span:nth-child(1){animation:fly1 3.2s linear infinite}
#flies span:nth-child(2){animation:fly2 2.6s linear infinite}
@keyframes fly1{0%,100%{transform:translate(-130px,-40px)}25%{transform:translate(-20px,-130px)}50%{transform:translate(110px,-60px)}75%{transform:translate(20px,10px)}}
@keyframes fly2{0%,100%{transform:translate(120px,-100px)}33%{transform:translate(-90px,-20px)}66%{transform:translate(40px,-150px)}}

#talkBox{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;transition:opacity .3s}
#talkBox.off{opacity:.35}
#talkBtn{width:76px;height:76px;border-radius:50%;border:none;background:var(--accent);font-size:34px;box-shadow:0 6px 0 #d96a22;cursor:pointer;touch-action:none}
#talkBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #d96a22}
#talkBtn.rec{background:var(--bad);box-shadow:0 0 0 0 rgba(239,83,80,.6);animation:recp 1s infinite}
@keyframes recp{0%{box-shadow:0 0 0 0 rgba(239,83,80,.6)}100%{box-shadow:0 0 0 22px rgba(239,83,80,0)}}
#voiceBtn{width:50px;height:50px;border-radius:50%;border:none;background:#fff;font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer}
#talkBox small{font-size:12px;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:9px;font-weight:600}

/* Modo silencio */
#meter{display:none;position:absolute;left:16px;top:16px;bottom:16px;width:58px;background:rgba(255,255,255,.9);border-radius:20px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#meter span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:24px}
#meterTrack{position:absolute;left:10px;right:10px;top:10px;bottom:44px;background:#ece6f6;border-radius:12px}
#meterFill{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:12px;background:var(--ok);transition:background .2s}
#meterTh{position:absolute;left:-6px;right:-6px;height:4px;margin-bottom:-2px;background:var(--ink);border-radius:2px}
#meterTh::after{content:'máx';position:absolute;left:100%;top:-9px;margin-left:6px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;padding:1px 6px;border-radius:6px}
#classStats{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,255,255,.92);padding:6px 18px;border-radius:999px;font-size:clamp(16px,2.6vw,22px);font-weight:600;white-space:nowrap}
.classmode #meter,.classmode #classStats{display:block}
.classmode #talkBox,.classmode #roomTitle{display:none}
.clsctl{flex:2;min-width:220px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:16px}
.clsctl input{width:100%;accent-color:var(--accent)}
.clsctl small{font-weight:400;opacity:.7}

/* Acciones */
#actions{min-height:94px;padding:10px;display:flex;gap:10px;overflow-x:auto;align-items:center;background:#fff;border-top:2px solid #efe8f7}
.food{flex:0 0 auto;width:74px;height:74px;border-radius:16px;background:#fff7ec;border:2px solid #f0dcc2;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.food.sweet{background:#fff0f6;border-color:#f6cfe0}
.food .fe{font-size:34px;line-height:1}
.food .price{font-size:13px;font-weight:600}
.food:active{transform:scale(.94)}
.act{flex:1;max-width:220px;height:72px;border-radius:16px;font-size:30px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:#f3eefc;cursor:pointer}
.act span{font-size:18px;font-weight:600}
.act.on{background:var(--ink);color:#fff}
#actions.fit{overflow-x:hidden;gap:8px}
#actions.fit .act{flex:1 1 0;min-width:0;max-width:none;flex-direction:column;gap:3px;font-size:clamp(24px,7vw,30px);padding:4px 2px;line-height:1.1}
#actions.fit .act span{font-size:clamp(12px,3.4vw,16px);text-align:center;line-height:1.15}
#actions.fit .hint{flex:1 1 0;min-width:0;font-size:clamp(12px,3.3vw,15px);text-align:center;line-height:1.2}
.hint{font-size:15px;opacity:.75;flex:1;min-width:160px}
.gcard{flex:1;min-width:110px;height:72px;border-radius:16px;border:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.gcard b{font-size:28px;line-height:1.1}
.gcard:active{transform:translateY(2px)}
.aura-r{transform-origin:100px 117px;animation:spin 16s linear infinite}
.aura-g{transform-origin:100px 117px;animation:auraP 2.4s ease-in-out infinite}
@keyframes auraP{50%{opacity:.6;transform:scale(1.05)}}
.wingL{transform-origin:46px 104px;animation:flap 1s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(-14deg)}}
.cape{transform-origin:100px 64px;animation:capeW 2.8s ease-in-out infinite}
@keyframes capeW{50%{transform:skewX(2.5deg) scaleX(1.03)}}
.pal-hop{transform-box:fill-box;animation:palHop 1.2s ease-in-out infinite}
@keyframes palHop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.pal-fly{transform-box:fill-box;animation:palFly 3s ease-in-out infinite}
@keyframes palFly{50%{transform:translate(-5px,-7px)}}
.dwing{transform-box:fill-box;transform-origin:50% 100%;animation:dflap .45s ease-in-out infinite}
@keyframes dflap{50%{transform:scaleY(.45)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.6s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateX(6px) scale(1.8)}}
.note{transform-box:fill-box;animation:noteF 2.2s ease-in-out infinite}.note.n2{animation-delay:1.1s}
@keyframes noteF{0%{opacity:0;transform:translateY(5px)}30%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.gem{animation:gemT 1.6s ease-in-out infinite}.gem.g2{animation-delay:.5s}.gem.g3{animation-delay:1s}
@keyframes gemT{50%{opacity:.5}}
.capecol{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0 10px;font-weight:600}
.cc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3dbf5;cursor:pointer;padding:0}
.cc.on{box-shadow:0 0 0 3px var(--ink)}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}
.mrow div{border-radius:12px;padding:6px 2px;text-align:center;background:#f3eefc;font-weight:700;font-size:15px}
.mrow div small{display:block;font-weight:600;font-size:12px;opacity:.8}
.mrow div.ok{background:linear-gradient(#fff3b0,#ffd54f);box-shadow:0 0 0 2px #e0a800 inset}
#celeb{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%,#46307e,#140e2a);display:flex;align-items:center;justify-content:center;animation:pop .4s ease;overflow:auto}
#celeb.half{background:radial-gradient(circle at 50% 40%,#2d5a8f,#0f1a33)}
#celebCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.cbox{position:relative;z-index:1;text-align:center;color:#fff;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.ctitle{font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.05;color:#ffd23f;text-shadow:0 3px 0 #a86f00,0 6px 18px rgba(0,0,0,.45);animation:ctit 1s ease-in-out infinite alternate}
#celeb.half .ctitle{font-size:clamp(28px,8vw,44px)}
@keyframes ctit{to{transform:scale(1.07)}}
.cpet{width:min(62vw,40vh,300px);aspect-ratio:1;margin-top:28px}
.cpet svg{width:100%;height:100%;overflow:visible;transform-origin:50% 60%;animation:cdance 2.4s ease-in-out infinite}
@keyframes cdance{0%{transform:translateY(0) rotate(0) scale(1)}12%{transform:translateY(-34px) rotate(-9deg)}24%{transform:translateY(0) scale(1.12,.88)}36%{transform:translateY(-30px) rotate(9deg)}48%{transform:translateY(0) scale(1.12,.88)}62%{transform:translateY(-52px) rotate(180deg)}74%{transform:translateY(-52px) rotate(360deg)}86%{transform:translateY(0) rotate(360deg) scale(1.1,.9)}100%{transform:translateY(0) rotate(360deg) scale(1)}}
.csub{font-size:19px;line-height:1.35}
.cprize{font-size:15px;line-height:1.35;background:rgba(255,255,255,.13);padding:8px 12px;border-radius:12px}
.cbox .btn:not(.primary){color:var(--ink);background:#fff}
.cbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#danceBtn{position:absolute;left:12px;top:48px;z-index:4;border:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;background:linear-gradient(#fff6b0,#ffc400);color:#2b2340;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
.classmode #danceBtn{display:none}
#godBtn{position:absolute;right:12px;top:48px;z-index:4;border:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;background:linear-gradient(#c8f7d4,#35c46a);color:#12351f;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
.classmode #godBtn{display:none}
#petFx.dance{animation:cdance 2.4s ease-in-out 2;transform-origin:50% 60%}
.dip img{width:100%;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);margin-top:12px}
.dip .btn{text-decoration:none;display:inline-block}
.swatch.rainbow{background:conic-gradient(#ff5252,#ffd23f,#69f0ae,#40c4ff,#b388ff,#ff5252)!important}
.swatch.gold{background:linear-gradient(135deg,#fff3b0,#ffc400 45%,#e0a400 55%,#fff3b0)!important}
.ibox{background:#f6f2fd;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.35}
.ilink{display:block;word-break:break-all;background:#fff;border-radius:10px;padding:6px 8px;font-size:14px}
.inote{font-size:13px;opacity:.8}
.wand{transform-origin:168px 158px;animation:wandW 1.6s ease-in-out infinite}
@keyframes wandW{50%{transform:rotate(-12deg)}}
.mfill{animation:mcol 5s linear infinite}
@keyframes mcol{0%{fill:#7e57c2}33%{fill:#26a69a}66%{fill:#ec407a}100%{fill:#7e57c2}}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flick .16s ease-in-out infinite alternate}.flame.f2{animation-duration:.12s}
@keyframes flick{to{transform:scaleY(1.3)}}
.aura-r2{transform-origin:100px 117px;animation:spin 22s linear infinite}
.cpet.d2 svg{animation:cdance2 2.6s ease-in-out infinite}
@keyframes cdance2{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(-20px) scale(.95,1.05)}30%{transform:translateY(0) scale(1.1,.9)}45%{transform:translateX(-30px) rotate(-14deg)}60%{transform:translateX(30px) rotate(14deg)}75%{transform:translateY(-60px) scale(1.08)}88%{transform:translateY(0) scale(1.12,.88)}}
#celeb.dall{background:radial-gradient(circle at 50% 40%,#1a237e,#05061a)}
#celeb.dhalf{background:radial-gradient(circle at 50% 40%,#311b92,#0d0626)}
#petFx.dance2{animation:cdance2 2.6s ease-in-out 2;transform-origin:50% 60%}
#dailyChip{display:none;position:absolute;right:10px;top:10px;z-index:4;max-width:62%;white-space:nowrap;border:none;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:clamp(12px,3.4vw,15px);background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer;animation:dpulse 2s ease-in-out infinite}
#dailyChip.done{animation:none;opacity:.85}
@keyframes dpulse{50%{transform:scale(1.05)}}
#stage.room-juegos #dailyChip{display:block}
.classmode #dailyChip{display:none!important}
.badge.daily{background:#e8f8ee;border-color:#2fbf71}
#actions.games{gap:8px;overflow-x:hidden}
#actions.games .gcard{min-width:0;flex:1 1 0;padding:0 4px;text-align:center;line-height:1.15;font-size:clamp(12px,3.5vw,16px)}
#actions.games .gcard b{font-size:clamp(22px,7vw,28px)}

/* Navegación */
#nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);padding:6px;gap:6px}
#nav button{border:none;background:transparent;color:#fff;border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:500}
#nav button span{font-size:26px;line-height:1.1}
#nav button.on{background:var(--accent)}

/* Toast */
#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;font-size:16px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Paneles */
#overlay{position:fixed;inset:0;background:rgba(30,20,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.panel{background:#fff;border-radius:22px;width:min(580px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .25s ease}
.panel.game{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.ghead{display:flex;align-items:center;gap:10px;font-size:20px}
.ghead span{margin-left:auto;font-weight:600}
.x{width:40px;height:40px;border-radius:50%;border:none;background:#f1ecfa;font-size:18px;cursor:pointer;flex:0 0 auto}
.ghead b+.x{margin-left:auto}
.prog{height:8px;background:#eee;border-radius:9px;margin:10px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qsub{text-align:center;font-size:18px;opacity:.75;margin-top:8px}
.qbig{font-size:clamp(34px,8vw,58px);text-align:center;margin:12px 0 14px;font-weight:600}
.qbig.emo{font-size:clamp(70px,16vw,110px);line-height:1.1}
.speak{width:110px;height:110px;border-radius:50%;border:none;background:#ffe7d6;font-size:54px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:clamp(20px,4.6vw,30px);padding:14px;border-radius:16px;border:3px solid #e6def7;background:#faf7ff;cursor:pointer;font-weight:500}
.opt.emoji{font-size:54px;line-height:1.1}
.opt.ok{background:#d6f7e3;border-color:var(--ok)}
.opt.bad{background:#ffe0df;border-color:var(--bad)}
.trans{text-align:center;font-size:22px;min-height:34px;margin-top:12px;font-weight:600;color:#5b4b8a}
.sub{font-size:15px;opacity:.75;margin:6px 0 12px}
.sec{font-size:18px;font-weight:600;margin:16px 0 8px}

/* Tablas ninja */
.tblgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.tbl{border:3px solid #e6def7;background:#faf7ff;border-radius:16px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tbl b{font-size:26px}
.tbl small{font-size:13px;font-weight:600;opacity:.8}
.tbl.gold{border-color:var(--gold);background:#fff8dc}
.nq{text-align:center;font-size:clamp(30px,7vw,48px);font-weight:700;margin:8px 0}
.nq span{color:var(--accent)}
#nWrap{position:relative;height:min(60vh,470px);border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#6b4632,#3b2417);touch-action:none}
#nCv{display:block;touch-action:none;cursor:crosshair}
.nflash{position:absolute;left:50%;top:14px;transform:translateX(-50%);color:#fff;font-size:20px;font-weight:600;background:rgba(0,0,0,.35);padding:4px 14px;border-radius:12px;pointer-events:none;transition:opacity .3s}

/* Splash y actualización */
#splash{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 42%,#ffd166,#ff8a5c 55%,#ff5f8f);overflow:hidden;transition:opacity .45s;padding:16px}
#splash::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.14) 0 15deg,transparent 15deg 30deg);animation:spin 50s linear infinite}
#splash>*{position:relative}
#splash.out{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spPet{width:min(46vw,40vh,250px);aspect-ratio:1;animation:bob 1.6s ease-in-out infinite}
.spPet svg{width:100%;height:100%;overflow:visible}
.spTitle{font-size:clamp(38px,9vw,64px);font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15);line-height:1}
.spSub{color:#fff;font-size:19px;font-weight:500}
.spBtns{display:flex;flex-direction:column;gap:8px;align-items:center;min-height:130px;justify-content:center}
.spBar{width:200px;height:10px;background:rgba(255,255,255,.4);border-radius:9px;overflow:hidden}
.spBar i{display:block;height:100%;background:#fff;width:0;animation:spload 1.2s ease forwards}
@keyframes spload{to{width:100%}}
.spBtn{font-size:22px;font-weight:600;padding:14px 30px;border-radius:18px;border:none;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.spBtn.primary{background:var(--ink);color:#fff}
.spBtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.spBtn.link{background:transparent;box-shadow:none;color:#fff;font-size:17px;text-decoration:underline;padding:6px 10px}
.spHint{color:#fff;max-width:340px;text-align:center;font-size:16px;background:rgba(0,0,0,.15);padding:8px 14px;border-radius:12px}
.spVer{position:absolute!important;bottom:10px;color:#fff;opacity:.75;font-size:13px}
.spBy{position:absolute!important;bottom:32px;color:#fff;opacity:.9;font-size:15px;font-weight:600}
.spDed{color:#fff;font-size:21px;font-weight:700;text-align:center;max-width:320px;background:rgba(0,0,0,.18);padding:10px 16px;border-radius:16px;line-height:1.3}
#updBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:65;background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:16px;white-space:nowrap;animation:pop .3s ease}
#updBar button{border:none;border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;font-size:15px}
#updBar button.no,#instBar button.no{background:transparent;opacity:.75;padding:8px 10px}
#instBar{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);z-index:65;background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:16px;white-space:nowrap;animation:pop .3s ease}
#instBar button{border:none;border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;font-size:15px}

/* Modos, frases y dictado */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{border:3px solid #e6def7;background:#faf7ff;border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:18px}.mode small{font-size:14px;opacity:.75}
.mode.done{border-color:var(--gold);background:#fff8dc}
.mode:disabled{opacity:.5;cursor:default}
.modes .mode:only-child{grid-column:1/-1}
.sent{text-align:center;font-size:clamp(22px,4.6vw,32px);font-weight:600;margin:-4px 0 16px}
.blank{display:inline-block;border-bottom:3px solid var(--accent);color:transparent;min-width:90px}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.slot{width:40px;height:50px;border-radius:10px;border:3px solid #e3dbf5;background:#faf7ff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}
.slot.fixed{border-color:transparent;background:transparent;width:18px}
.slots.ok .slot:not(.fixed){border-color:var(--ok);background:#d6f7e3}
.slots.bad .slot:not(.fixed){border-color:var(--bad);background:#ffe0df}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.tile{width:52px;height:56px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-size:28px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 #120d1f}
.tile:disabled{opacity:.2;cursor:default}
.speak.sm{width:64px;height:64px;font-size:30px;margin-bottom:6px}
.streakbox{margin-top:10px;background:#fff1e6;border-radius:14px;padding:10px 14px;font-size:17px}
.egg{cursor:pointer}.egg.shake{animation:eggshake .35s}
@keyframes eggshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.crack{fill:none;stroke:#8a6d3b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}

/* Selector de tablas */
.tpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.tp{border:3px solid #e6def7;background:#faf7ff;border-radius:16px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tp b{font-size:26px}.tp small{font-size:13px;font-weight:600;opacity:.8}
.tp.gold{border-color:var(--gold);background:#fff8dc}
.tp.on{border-color:var(--accent);background:#fff1e6;box-shadow:inset 0 0 0 2px var(--accent)}
.tp.lock{opacity:.45;filter:grayscale(1)}
.tp .ck{position:absolute;top:3px;right:7px;font-size:15px;color:var(--accent)}
.pickbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pickbar .btn{padding:8px 14px;font-size:16px}
.pickbar .btn:disabled{opacity:.5;cursor:default}
.pickinfo{text-align:center;font-weight:600;margin-top:12px;min-height:24px}
/* Escribe el resultado */
.wq{text-align:center;font-size:clamp(36px,9vw,58px);font-weight:700;margin:4px 0}
.wq span{color:var(--accent)}
.tbar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:4px 0 8px}
.tbar i{display:block;height:100%;width:100%;background:var(--ok)}
.wans{width:fit-content;min-width:130px;height:68px;padding:0 18px;margin:0 auto 4px;border-radius:16px;border:3px solid #e3dbf5;background:#faf7ff;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700}
.wans.ok{border-color:var(--ok);background:#d6f7e3}.wans.bad{border-color:var(--bad);background:#ffe0df}
.wmsg{text-align:center;font-size:20px;font-weight:600;min-height:30px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:6px auto 0}
.key{height:56px;border-radius:14px;border:none;background:var(--ink);color:#fff;font-size:28px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 #120d1f}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #120d1f}
.key.del{background:#eee8fb;color:var(--ink);box-shadow:0 4px 0 #cfc5ea}
.key.ok{background:var(--ok);box-shadow:0 4px 0 #1e8a50}

/* Atrapa */
#cArea{position:relative;height:min(58vh,460px);background:linear-gradient(#cfeeff,#e9f9ff 78%,#9fdc8f 78%);border-radius:16px;overflow:hidden;touch-action:none;margin-top:10px}
#catcher{position:absolute;bottom:4px;left:0;width:78px;height:78px}
#catcher svg{width:100%;height:100%;overflow:visible}
.fnum{position:absolute;top:0;left:0;width:54px;height:54px;border-radius:50%;background:#fff;border:4px solid #ffb547;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);will-change:transform}
#aArea{position:relative;height:min(62vh,500px);border-radius:16px;overflow:hidden;touch-action:none;margin-top:10px;background:#9fdc8f}
#aCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cQ{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.92);color:var(--ink);border-radius:14px;padding:4px 14px;font-size:clamp(22px,6.5vw,30px);font-weight:700;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#cQ:empty{display:none}
#cLives{position:absolute;top:8px;right:12px;font-size:24px;z-index:2}
#cIntro{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.7);text-align:center;padding:12px;transition:opacity .4s}
#cIntro b{font-size:clamp(34px,8vw,52px)}#cIntro span{font-size:20px;font-weight:600}
#cScore{position:absolute;top:8px;left:12px;font-size:30px;font-weight:700;z-index:2}
.cfx{position:absolute;font-size:24px;font-weight:700;animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}

/* Comunes */
.ptitle{font-size:24px;font-weight:600;text-align:center;margin-bottom:6px}
.result{text-align:center}
.stars{font-size:46px;min-height:56px}
.reward{font-size:24px;margin:6px 0}
.badge{font-size:22px;font-weight:600;background:#fff8dc;border:3px solid var(--gold);border-radius:16px;padding:10px;margin:10px auto;max-width:420px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.rbtns .btn{padding:12px 6px;font-size:17px}.rbtns .wide{grid-column:1/-1}
.btn{font-size:18px;padding:12px 22px;border-radius:14px;border:none;cursor:pointer;background:#eee8fb;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:#ffe0df;color:#c62828}
.lbl{display:block;font-weight:600;margin:14px 0 6px}
.panel input{width:100%;font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:2px solid #e3dbf5;outline:none}
.panel input:focus{border-color:var(--accent)}
.pw{position:relative}.pw input{padding-right:56px}.pwEye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eee8fb;border-radius:10px;font-size:22px;width:44px;height:40px;cursor:pointer}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:12px;border:2px solid #e3dbf5;background:#fff;font-size:18px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:14px;opacity:.7;margin-top:14px}
.help{font-size:17px;line-height:1.45}
.help li{margin-bottom:6px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1 1 auto;padding:9px 10px;border-radius:12px;border:none;background:#f3eefc;font-size:16px;cursor:pointer;font-weight:600}
.tab.on{background:var(--ink);color:#fff}
.shopPrev,.wpet{width:130px;height:130px;margin:0 auto}
.shopPrev svg,.wpet svg{width:100%;height:100%;overflow:visible}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.item{border:3px solid #eee;border-radius:16px;padding:8px;text-align:center;cursor:pointer;background:#fff}
.item.eq{border-color:var(--ok);background:#effcf4}
.item .thumb{height:64px;display:flex;align-items:center;justify-content:center}
.item .thumb svg{height:64px;width:auto;max-width:100%;overflow:hidden;border-radius:10px}
.item.locked .thumb{filter:grayscale(1);opacity:.4}
.swatch{width:52px;height:52px;border-radius:50%}
.item .ie{font-size:42px;line-height:60px}
.iname{font-weight:600;font-size:15px}
.tag{font-size:13px;margin-top:2px;opacity:.85}
.flyfood{position:fixed;font-size:40px;z-index:40;pointer-events:none;transition:transform .5s cubic-bezier(.4,-.3,.6,1);transform:translate(-50%,-50%)}
@media (max-width:520px){
  .ni{font-size:18px}.need{padding:4px 5px;gap:4px}
  #nav button{font-size:11px}
  .tblgrid{grid-template-columns:repeat(4,1fr)}
  .chip{padding:6px 9px;font-size:15px}
  .xpbar{display:none}
}
/* ===== Estadio ===== */
#nav{grid-template-columns:repeat(5,1fr)}
#nav button.locked{opacity:.55}
#nav button.locked span::after{content:'🔒';font-size:13px;position:relative;top:-12px;left:-4px}
.room-estadio .wall{background:linear-gradient(#2c3a6b,#1f2a52)}
.room-estadio .wall::before{content:'';position:absolute;left:0;right:0;top:0;height:62%;background-image:radial-gradient(circle,#ff8a80 0 4px,transparent 5px),radial-gradient(circle,#ffe082 0 4px,transparent 5px),radial-gradient(circle,#80d8ff 0 4px,transparent 5px),radial-gradient(circle,#c5e1a5 0 4px,transparent 5px);background-size:44px 26px,52px 30px,60px 34px,38px 22px;background-position:0 0,22px 10px,10px 18px,30px 4px;opacity:.8}
.room-estadio .wall::after{content:'';position:absolute;left:0;right:0;bottom:0;height:13%;background:repeating-linear-gradient(90deg,#fff 0 70px,#e53935 70px 140px,#1e88e5 140px 210px,#ffd23f 210px 280px);border-top:3px solid #fff;opacity:.95}
.room-estadio .floor{background:repeating-linear-gradient(90deg,#43a047 0 44px,#388e3c 44px 88px);border-top:5px solid #fff}
#ligaChip{display:none;position:absolute;right:10px;top:52px;z-index:4;border:none;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:clamp(12px,3.4vw,15px);background:#ffd23f;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
#ligaChip.show{display:block}
#godBtn:not(.hidden)~#ligaChip{top:96px}
.classmode #ligaChip{display:none!important}
.stlock{text-align:center;font-size:64px;margin:6px 0}
.fstats{display:flex;gap:8px;margin:8px 0}
.fstats div{flex:1;background:#f6f1ff;border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;font-weight:600}
.fstats b{display:block;font-size:24px}
/* oxidación y récords */
.tp.rust{border-color:#a1887f;background:#efebe9;filter:saturate(.6)}
.tp.rust::after{content:'🟤 oxidada';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:#8d6e63;color:#fff;border-radius:999px;padding:1px 6px;white-space:nowrap}
/* leyenda */
#stage.legend #petSvg{animation:legendGlow 2.4s ease-in-out infinite}
@keyframes legendGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,214,64,.7))}50%{filter:drop-shadow(0 0 18px rgba(255,214,64,1))}}
/* accesorios nuevos */
.kitcol{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:6px 0 10px;font-weight:600}
.kitcol .kc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfc6e6;cursor:pointer}
.kitcol .kc.on{box-shadow:0 0 0 3px var(--ink)}
.kitnum{display:flex;align-items:center;gap:8px}
.kitnum button{width:36px;height:36px;border-radius:50%;border:none;background:#eee8fb;font-size:20px;font-weight:700;cursor:pointer}
.kitnum b{min-width:34px;text-align:center;font-size:22px}
/* penaltis */
.pnq{text-align:center;font-size:clamp(28px,8vw,40px);font-weight:800;margin:2px 0 6px;line-height:1.1}
.pnq small{display:block;font-size:15px;font-weight:600;opacity:.75;margin-bottom:2px}
.pnq span{color:var(--accent)}
.pnans{color:#2e7d32;font-size:1.1em}.pnans.red{color:#d84315}
.pnf{position:relative;height:min(56vh,430px);border-radius:16px;overflow:hidden;background:repeating-linear-gradient(90deg,#43a047 0 12.5%,#388e3c 12.5% 25%);touch-action:manipulation}
.pnstands{position:absolute;left:0;right:0;top:0;height:16%;background:#3f4f86;background-image:radial-gradient(circle,#ff8a80 0 3px,transparent 4px),radial-gradient(circle,#ffe082 0 3px,transparent 4px),radial-gradient(circle,#80d8ff 0 3px,transparent 4px);background-size:18px 12px,22px 14px,26px 16px;background-position:0 0,9px 5px,4px 9px;border-bottom:4px solid #fff}
.pngoal{position:absolute;left:6%;right:6%;top:17%;height:40%;border:7px solid #fff;border-bottom:none;border-radius:4px 4px 0 0;background-color:rgba(255,255,255,.12);background-image:linear-gradient(rgba(255,255,255,.35) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.35) 1.5px,transparent 1.5px);background-size:14px 14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.pngoal.shake{animation:netsh .5s ease-out}
@keyframes netsh{0%{background-position:0 0}25%{background-position:3px 5px;transform:scale(1.015)}50%{background-position:-3px 2px}100%{background-position:0 0;transform:scale(1)}}
.pz{border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;z-index:3}
.pz span{min-width:46px;height:46px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:clamp(18px,5.4vw,24px);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .15s,background .2s}
.pz:active span{transform:scale(.92)}
.pz.ok span{background:#69f0ae}.pz.bad span{background:#ff8a80}.pz.ans span{background:#69f0ae;animation:ansq .5s ease 2}
@keyframes ansq{50%{transform:scale(1.2)}}
.pnkeep{position:absolute;left:50%;top:57%;width:24%;max-width:110px;aspect-ratio:1;transform:translate(-50%,0);transition:transform .3s cubic-bezier(.3,.7,.4,1);z-index:4;pointer-events:none}
.pnkeep svg,.pnkick svg{width:100%;height:100%;overflow:visible}
.pnspot{position:absolute;left:50%;top:89%;width:16px;height:6px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.pnkick{position:absolute;left:30%;top:80%;width:18%;max-width:80px;aspect-ratio:1;z-index:2;pointer-events:none;transform:translate(-50%,-50%)}
.pnball{position:absolute;left:50%;top:86%;font-size:min(10vw,42px);line-height:1;transform:translate(-50%,-50%);z-index:5;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));transition:left .4s cubic-bezier(.2,.7,.3,1),top .4s cubic-bezier(.2,.7,.3,1),transform .4s,opacity .3s}

.pnmsg{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%) scale(.4);opacity:0;font-size:clamp(26px,8vw,46px);font-weight:900;color:#fff;-webkit-text-stroke:2px #2b2340;text-shadow:0 4px 0 rgba(0,0,0,.25);width:94%;text-align:center;line-height:1.05;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:6;pointer-events:none}
.pnmsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pnmsg.good{color:#ffd23f}.pnmsg.bad{color:#fff}
.pntimer{position:absolute;left:8%;right:8%;bottom:4%;height:10px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden;z-index:5}
.pntimer i{display:block;height:100%;width:100%;background:var(--ok)}
/* baloncesto */
.bkc{position:relative;height:min(56vh,430px);border-radius:16px;overflow:hidden;background:linear-gradient(#ffcc80 0 55%,#d7a86e 55%);background-image:linear-gradient(#ffcc80 0 55%,transparent 55%),repeating-linear-gradient(90deg,#d7a86e 0 30px,#c99a5e 30px 32px)}
.bkboard{position:absolute;left:50%;top:6%;width:42%;max-width:190px;aspect-ratio:1.6;transform:translateX(-50%);background:#fff;border:5px solid #455a64;border-radius:8px}
.bksq{position:absolute;left:30%;right:30%;top:38%;bottom:22%;border:4px solid #e53935}
.bkrim{position:absolute;left:28%;right:28%;bottom:-10px;height:10px;border-radius:6px;background:#ff5722;border:2px solid #bf360c;z-index:3}
.bknet{position:absolute;left:31%;right:31%;bottom:-48px;height:40px;background:repeating-linear-gradient(60deg,transparent 0 6px,rgba(255,255,255,.9) 6px 8px),repeating-linear-gradient(-60deg,transparent 0 6px,rgba(255,255,255,.9) 6px 8px);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);transform-origin:top}
.bknet.swish{animation:swishq .45s ease-out}
@keyframes swishq{40%{transform:scaleY(1.25) scaleX(.9)}100%{transform:scale(1)}}
.bkq{position:absolute;left:0;right:0;top:52%;text-align:center;font-size:clamp(30px,9vw,44px);font-weight:800;color:var(--ink)}
.bkq span{color:var(--accent)}
.bkfire{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-weight:800;color:#d84315;opacity:0;transition:opacity .3s}
.bkfire.on{opacity:1;animation:ansq .8s ease infinite}
.bkballs{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:space-evenly;padding:0 2%}
.bkb{width:min(19vw,78px);aspect-ratio:1;border:none;background:none;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.bkb i{font-style:normal;font-size:min(17vw,70px);line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}

.bkb span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);border-radius:999px;min-width:42px;padding:2px 6px;font-size:clamp(18px,5.2vw,24px);font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bkb.ok{visibility:hidden}.bkb.bad{opacity:.35}.bkb.ans span{background:#69f0ae}
.bkb:active{transform:scale(.94)}
.bkfly{position:absolute;font-size:min(14vw,56px);z-index:5;pointer-events:none;line-height:1}
.bkmsg{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.4);opacity:0;font-size:clamp(30px,9vw,48px);font-weight:900;-webkit-text-stroke:2px #2b2340;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;z-index:6}
.bkmsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bkmsg.good{color:#ffd23f}.bkmsg.bad{color:#fff}
/* liga */
.lgreto{background:#fff8dc;border:2px solid var(--gold);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px}
.lgbar{height:14px;border-radius:999px;background:#eee;margin:6px 0 4px;overflow:hidden}
.lgbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff9100)}
.lglist{list-style:none;padding:0;margin:8px 0}
.lglist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;font-size:17px}
.lglist li:nth-child(odd){background:#f6f1ff}
.lglist li.me{background:#ffe0b2;font-weight:700}
.lgp{width:34px;text-align:center;font-weight:700}
.lgn{flex:1}
.lgn small{opacity:.65;font-weight:600}
#lgTabs{margin:6px 0 8px}#lgTabs button{font-size:15px;padding:8px 4px}#lgPer{margin:6px 0}#lgPer button{font-size:15px;padding:8px}
.lgx{font-weight:700}
.lgme{text-align:center;font-size:16px;margin:6px 0}
/* ===================== PINCHÍN ===================== */
:root{--pet:#9a6a45;--pet-dark:#6b4428;--pet-light:#f6dfc0;--ink:#3b2a1e;--bg:#f7f1e3;--accent:#ff7a3d}
body{background:#3b2a1e}
#nav{background:#3b2a1e}
.spk{fill:var(--pet);stroke:var(--pet-dark);stroke-width:3;stroke-linejoin:round}
.spl{fill:none;stroke:var(--pet-dark);stroke-width:2.5;stroke-linecap:round;opacity:.55}
.skin{fill:var(--pet-light)}
.skind{fill:#e8c49c}
.room-juegos .wall{background:#ffe9b8;background-image:radial-gradient(#ffd98a 3px,transparent 4px);background-size:34px 34px}
.room-juegos .floor{background:#9ad77f}
#splash{background:radial-gradient(circle at 50% 42%,#ffe082,#ffab57 55%,#ff7a5c)}
.spTitle{text-align:center}
#palEl{transform-box:fill-box}
/* casas */
.hcards{display:flex;gap:10px;width:100%}
.hcard{flex:1;min-width:0;height:76px;border:none;border-radius:18px;color:#fff;font-weight:700;font-size:clamp(14px,4vw,18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;position:relative}
.hcard b{font-size:clamp(26px,8vw,34px);line-height:1}
.hcard.lock{filter:grayscale(.9);opacity:.6}
.hcard.lock::after{content:'🔒';position:absolute;top:4px;right:8px;font-size:18px}
.hgrid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px;align-items:stretch;margin-top:10px}
.hmode{display:flex;align-items:center;justify-content:center;font-size:clamp(26px,8vw,40px);background:#fff6e6;border-radius:16px;padding:6px 10px;min-width:74px;line-height:1}
.hmode small{font-size:.6em;font-weight:800}
.hlv{border:4px solid #f0dcc2;background:#fff;border-radius:18px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:22px;padding:4px}
.hlv .dots{letter-spacing:2px;color:var(--accent);font-size:clamp(18px,5vw,24px)}
.hlv .st{font-size:clamp(14px,4vw,20px);letter-spacing:-1px}
.hlv.ok{border-color:var(--gold);background:#fff8dc}
.hlv.lock{opacity:.4;filter:grayscale(1)}
.hlv.daily{box-shadow:0 0 0 4px #2fbf71}
.hlv:active{transform:scale(.95)}
/* partida */
.gtop{display:flex;align-items:center;gap:8px}
.gdots{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.gdots i{width:14px;height:14px;border-radius:50%;background:#eee3d0;display:block}
.gdots i.ok{background:var(--ok)}.gdots i.bad{background:#ffb547}.gdots i.cur{box-shadow:0 0 0 3px var(--ink)}
.spk2{width:54px;height:54px;border-radius:50%;border:none;background:#ffe7d6;font-size:28px;cursor:pointer;flex:0 0 auto}
.opline{text-align:center;font-size:clamp(40px,12vw,72px);font-weight:700;margin:6px 0 4px;line-height:1.1}
.opline.sm{font-size:clamp(30px,9vw,48px)}
.opline span{color:var(--accent)}
.zones{display:flex;align-items:stretch;justify-content:center;gap:6px;margin-top:6px}
.zone{flex:1;min-width:0;max-width:300px;background:#fff8ec;border:4px dashed #f0cfa0;border-radius:20px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s}
.zone.okz{border-color:var(--ok);border-style:solid}
.zone.shake{animation:shkq .1s linear 6}
.zlab{font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1;color:var(--ink)}
.plus{align-self:center;font-size:clamp(34px,10vw,52px);font-weight:700;color:var(--accent)}
.tf{display:grid;grid-template-columns:repeat(5,var(--fs));gap:4px;justify-content:center;min-height:calc(var(--fs)*2 + 4px);--fs:clamp(28px,7.6vw,46px)}
.tf.big{--fs:clamp(34px,9vw,58px)}
.fr{width:var(--fs);height:var(--fs);font-size:calc(var(--fs)*.84);line-height:var(--fs);text-align:center;border:none;background:none;padding:0;cursor:pointer;position:relative;user-select:none}
.fr.ghost{opacity:.22;filter:grayscale(1);cursor:default}
.fr.extra{animation:pulse 1s infinite;border-radius:50%}
.fr.pop{animation:frpop .25s ease}
@keyframes frpop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.fr.gone{opacity:.25;filter:grayscale(1)}
.fr.gone::after{content:'✖';position:absolute;inset:0;color:#e53935;font-size:calc(var(--fs)*.8);font-weight:900}
.fr .cn{position:absolute;right:-4px;top:-6px;background:var(--ink);color:#fff;font-size:15px;line-height:20px;min-width:20px;height:20px;border-radius:10px;font-weight:700;padding:0 3px}
.addb{border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:clamp(24px,7vw,34px);font-weight:700;padding:6px 14px;box-shadow:0 4px 0 #c55a22;cursor:pointer;min-width:84px}
.addb:active{transform:translateY(3px);box-shadow:0 1px 0 #c55a22}
.plate{background:#eef7ff;border:4px dashed #9fcdf2;border-radius:20px;padding:6px;margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.plate .zlab{font-size:clamp(26px,8vw,40px)}
.bigok{display:block;margin:12px auto 2px;border:none;border-radius:20px;background:var(--ok);color:#fff;font-size:34px;font-weight:700;padding:8px 40px;box-shadow:0 5px 0 #1e8a50;cursor:pointer}
.bigok:active{transform:translateY(3px);box-shadow:0 2px 0 #1e8a50}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:440px;margin:10px auto 0}
.pk{height:clamp(56px,15vw,76px);border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:clamp(30px,9vw,42px);font-weight:700;box-shadow:0 4px 0 #1b120c;cursor:pointer}
.pk:active{transform:translateY(3px);box-shadow:0 1px 0 #1b120c}
.pk.bad{background:#e9d9d9;color:#b33;box-shadow:none}
.pk.hl{background:var(--ok);animation:ansq .6s ease infinite}
.gch{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.gc{border:4px solid #f0dcc2;background:#fff;border-radius:18px;padding:6px;cursor:pointer;--fs:clamp(20px,5.6vw,30px)}
.gc .tf{min-height:0}
.gc.bad{opacity:.35}
.gc.hl{border-color:var(--ok);animation:ansq .6s ease infinite}
.gmsg{text-align:center;font-size:20px;font-weight:600;min-height:28px;margin-top:6px}
.tapinfo{text-align:center;font-size:15px;opacity:.7;margin-top:2px}
.rstars{font-size:56px;text-align:center;min-height:64px}
.gift{font-size:20px;font-weight:600;background:#fff8dc;border:3px solid var(--gold);border-radius:16px;padding:10px;margin:8px auto;max-width:420px;text-align:center}
/* estadio */
.pngoal.z6{grid-template-rows:repeat(2,1fr)}
.stq{text-align:center;font-weight:800;line-height:1.1;margin:0 0 4px}
.stq .frs{font-size:clamp(16px,4.6vw,24px);letter-spacing:-2px;display:block;min-height:1.2em}
.stq .frs s{opacity:.3;text-decoration:none;filter:grayscale(1)}
.stq .num{font-size:clamp(30px,9vw,44px)}
.stq .num span{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.bkballs.b3 .bkb{width:min(24vw,96px)}.bkballs.b3 .bkb i{font-size:min(21vw,86px)}
/* acceso con frutas */
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px auto;max-width:440px}
.lf{aspect-ratio:1;border:4px solid #f0dcc2;background:#fff;border-radius:18px;font-size:clamp(30px,9vw,46px);cursor:pointer;padding:0}
.lf:active{transform:scale(.92)}
.lslots{display:flex;gap:10px;justify-content:center;margin:8px 0}
.lslots div{width:clamp(58px,17vw,78px);aspect-ratio:1;border:4px dashed #d9c3a3;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,10vw,46px);background:#fffaf2}
.lslots.shake{animation:shkq .1s linear 6}
.lbtns{display:flex;gap:10px;justify-content:center}
.lbtns .btn{font-size:24px;padding:12px 26px}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px;max-height:52vh;overflow:auto}
.nb2{border:3px solid #f0dcc2;background:#fff;border-radius:14px;padding:12px 6px;font-size:19px;font-weight:600;cursor:pointer}
.nb2.new{background:#e8f8ee;border-color:var(--ok)}
.sugs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
/* diagnóstico */
#diag{position:fixed;inset:0;z-index:300;background:#fff;color:#222;overflow:auto;padding:16px;font:15px/1.4 system-ui,sans-serif}
#diag h1{font-size:20px;margin:0 0 10px}
#diag table{border-collapse:collapse;width:100%;max-width:720px}
#diag td{border-bottom:1px solid #eee;padding:6px 4px;vertical-align:top}
#diag td:first-child{width:42%;font-weight:600}
#diag .ok{color:#1e8a50}#diag .ko{color:#c62828}#diag .wa{color:#b26a00}
#diag button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid #ccc;background:#f6f6f6;margin:6px 6px 0 0;cursor:pointer}
@media (max-width:420px){.hgrid{gap:6px}.hmode{min-width:58px;padding:4px}.hlv{min-height:76px}}
.zones .tf{grid-template-columns:repeat(3,var(--fs));--fs:clamp(34px,10.5vw,54px);min-height:calc(var(--fs)*1 + 4px)}
.zone{padding:8px 4px}
.fr.ghost{opacity:.3}
.stq .frs{font-size:clamp(22px,6.2vw,32px);letter-spacing:0;line-height:1.15}
#toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-20px)}
#toast.show{transform:translate(-50%,0)}
#sVoz{display:grid;grid-template-columns:1fr 1fr}
.eqrow{text-align:center;font-size:clamp(30px,9vw,44px);font-weight:700;color:var(--accent);line-height:1;margin:4px 0}
.zone.bank{max-width:none;margin:0 auto;background:#effaf2;border-color:#9fd8b0}
.zone.bank.okz{border-color:var(--ok)}
/* conjuntos (v1.0.2) */
.csets{align-items:flex-start}
.cset{flex:1;min-width:0;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cset.wide{max-width:none;width:100%;flex:none}
.conj{--cfs:clamp(26px,min(8vw,5vh),42px);width:100%;border:4px solid #f0cfa0;background:#fff8ec;border-radius:50%/40%;display:flex;align-items:center;justify-content:center;padding:10px 6px;cursor:pointer;height:calc(var(--cfs)*3 + 40px);transition:border-color .2s,background .2s}
.conj .tf,.zones .conj .tf{--fs:var(--cfs);grid-template-columns:repeat(3,var(--fs));min-height:0;gap:3px}
.cset.wide .conj{height:calc(var(--cfs)*2 + 40px)}
.cset.wide .conj .tf,.conj.res .tf{grid-template-columns:repeat(5,var(--fs))}
.conj.res{height:calc(var(--cfs)*2 + 36px);max-width:none;cursor:default;border-style:dashed;border-color:#cfe7d6;background:#f6fbf7}
.conj.res.bank{cursor:default;border-style:solid;border-color:#9fd8b0}
.conj.ok{border-color:var(--ok);background:#effaf2}
.conj.over{border-color:#ffb547;background:#fff4e0;animation:pulse 1s infinite}
.conj.shake{animation:shkq .1s linear 6}
.crow{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.clab{font-size:clamp(30px,9vw,46px);font-weight:700;line-height:1}
.cminus{color:var(--bad)}
.addb.sm{font-size:clamp(18px,5vw,24px);padding:4px 10px;min-width:60px}
.pad.off .pk{opacity:.3}

function factsFor(h,l){
  const max=LV_MAX[l],min=LV_MAX[l-1],all=[];
  if(h==='s'){for(let a=1;a<max;a++)for(let b=1;a+b<=max;b++)all.push([a,b]);}
  else{for(let a=2;a<=max;a++)for(let b=1;a-b>=1;b++)all.push([a,b]);}
  const top=all.filter(([a,b])=>(h==='s'?a+b:a)>min),rest=all.filter(([a,b])=>(h==='s'?a+b:a)<=min);
  let out=shuffle(top.slice()).slice(0,l===1?10:7);
  out=out.concat(shuffle(rest.slice()).slice(0,10-out.length));
  while(out.length<10)out.push(pick(all));
  return shuffle(out);
}

function choicesFor(res,n){const c=[res];for(const d of shuffle([1,-1,2,-2,3,-3]))if(c.length<n&&res+d>=1&&res+d<=10)c.push(res+d);

function tone(f,d,{type='sine',vol=.18,at=0,to=null}={}){
  if(!actx||!S.sound)return;
  const t=actx.currentTime+at,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,{vol=.15,at=0,freq=1200,q=1,type='bandpass'}={}){
  if(!actx||!S.sound)return;
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const t=actx.currentTime+at,s=actx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=actx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(actx.destination);s.start(t);s.stop(t+d+.05);
}

   Chrome se salta las entradas del historial creadas justo después de pulsar «atrás» si no se ha tocado la pantalla

let ignorePop=0,panelBack=null,bkAct=true;const BK_R=6;

const bkDepth=()=>{const s=history.state;return s&&s.mascota?(s.d||1):0;};
function ensureGuard(){if(!bkAct)return;try{for(let i=bkDepth()+1;i<=BK_R;i++)history.pushState({mascota:1,d:i},'');}catch(e){}}

function goBack(){
  if($('#celeb')){closeCeleb();return;}
  if(!$('#overlay').classList.contains('hidden')){
    if(panelBack==='block')return;
    if(typeof panelBack==='function')panelBack();else closePanel();
    return;
  }
  if(classMode){exitClass();return;}
  if(room!=='cocina')goRoom('cocina');
}

  bkAct=false;   // hasta el próximo toque no se crean entradas nuevas
  if(ignorePop>0){ignorePop--;return;}
  goBack();
  if(atHome())setTimeout(syncHome,60);
});

function applyFace(f){
  let e='open',m='happy',open=0;
  switch(f){
    case'neutral':m='neutral';break;case'sad':m='sad';break;
    case'sleep':e='closed';m='small';break;case'laugh':e='happy';open=10;break;
    case'love':e='happy';break;case'dizzy':e='dizzy';m='wavy';break;case'sick':m='wavy';break;
    case'listen':open=4;break;case'talk':open=3;break;case'eat':e='happy';open=9;break;case'sneeze':e='happy';open=7;break;
    case'angry':m='wavy';break;
    case'fart':e='closed';m='happy';break;
    case'yawn':e='closed';open=16;break;
    case'peste':e='closed';m='wavy';break;
  }
  const eyes={open:'#eyesOpen',closed:'#eyesClosed',happy:'#eyesHappy',dizzy:'#eyesDizzy'};
  Object.entries(eyes).forEach(([k,s])=>$(s).classList.toggle('hide',k!==e));
  const mo=$('#mouth'),mO=$('#mouthOpen');
  if(open){mo.classList.add('hide');mO.classList.remove('hide');mO.setAttribute('ry',open);}
  else{mO.classList.add('hide');mo.classList.remove('hide');mo.setAttribute('d',mouthPath(S.mouth,m));}
  const md=MOUTHS[S.mouth]||{};
  $('#mouthDeco').style.display=md.deco&&(md.always||(!open&&m==='happy'))?'':'none';
  $('#petSvg').classList.toggle('sick',f==='sick');
  $('#brows').classList.toggle('hide',f!=='angry');
}

/* ---------- Modo silencio (medidor de ruido para clase) ---------- */
let classMode=false,cls=null;
async function enterClass(){
  if(busy||classMode)return;
  ensureAudio();
  if(!window.isSecureContext)return micHelp('insecure');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return micHelp('unsupported');
  let stream;
  // Sin control automático de ganancia ni supresión de ruido, para medir el ruido real del aula
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
  catch(err){return micError(err);}
  const src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();an.fftSize=1024;src.connect(an);
  cls={stream,src,an,data:new Float32Array(an.fftSize),level:0,over:0,quiet:0,awake:false,wakes:0,silent:0,run:0,coinAcc:0,last:performance.now()};
  classMode=true;S.sleeping=true;soapOn=false;$('#stage').style.setProperty('--px','50%');
  $('#app').classList.add('classmode');
  clearTempFace();updateNight();renderActions();updateThreshold();
  sfx('yawn');say('Zzz… Si hay mucho ruido, me despierto 😴',3200);
  requestAnimationFrame(classLoop);
}
function updateThreshold(){$('#meterTh').style.bottom=S.classTh+'%';const v=$('#thVal');if(v)v.textContent=S.classTh;}
const mmss=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function classLoop(t){
  if(!classMode||!cls)return;
  const c=cls,dt=Math.min(.1,(t-c.last)/1000);c.last=t;
  c.an.getFloatTimeDomainData(c.data);
  let s=0;for(let i=0;i<c.data.length;i++)s+=c.data[i]*c.data[i];
  const db=20*Math.log10(Math.sqrt(s/c.data.length)+1e-8);
  const lvl=clamp((db+60)/55*100,0,100);
  c.level+= (lvl-c.level)*(lvl>c.level?.5:.08); // sube rápido, baja despacio
  const th=S.classTh,f=$('#meterFill');
  f.style.height=c.level.toFixed(1)+'%';
  f.style.background=c.level>=th?'var(--bad)':c.level>=th*.75?'#ffb547':'var(--ok)';
  if(c.level>th){c.over+=dt;c.quiet=0;}else{c.over=0;c.quiet+=dt;}
  if(!c.awake&&c.over>.35)noiseWake();
  else if(c.awake&&c.quiet>4)noiseSleep();
  if(!c.awake){
    c.silent+=dt;c.run+=dt;c.coinAcc+=dt;if(c.run>S.stats.silentBest)S.stats.silentBest=Math.floor(c.run);
    if(c.coinAcc>=60){c.coinAcc-=60;S.coins++;sfx('coin');fxPet('+1 🪙',100,40);updateUI();save();}
  }
  $('#classStats').textContent=`🤫 Silencio ${mmss(c.silent)} · 😠 Despertares ${c.wakes}`;
  requestAnimationFrame(classLoop);
}
function noiseWake(){
  const c=cls;c.awake=true;c.wakes++;c.coinAcc=0;c.run=0;
  S.sleeping=false;updateNight();squish();
  setTempFace('angry');sfx('alarm');fxPet('💢',140,50);
  say(pick(['¡Qué ruido! 😣','¡Shhh! Quiero dormir 😴','¡Me habéis despertado! 😠','¡Bajad la voz, porfa! 🙉']),3500);
}

}

async function startRec(){
  if(!window.isSecureContext)return micHelp('insecure');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return micHelp('unsupported');
  clearTimeout(micRelease);
  if(!micStream){
    try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
    catch(err){return micError(err);}
    if(!pressing){toast('¡Micrófono listo! Mantén pulsado y habla 🎤');scheduleMicRelease();return;}
  }
  if(!pressing)return;
  chunks=[];
  try{recorder=new MediaRecorder(micStream);}catch(e){recorder=null;return micHelp('unknown');}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  recorder.onstop=onRecStop;recorder.start();recT0=performance.now();
  tb.classList.add('rec');earsWig(true);setTempFace('listen');busy=true;
  recMax=setTimeout(()=>{pressing=false;stopRec();},6000);
}
function stopRec(){clearTimeout(recMax);if(recorder&&recorder.state==='recording')recorder.stop();}
async function onRecStop(){
  tb.classList.remove('rec');earsWig(false);
  const dur=performance.now()-recT0,type=recorder.mimeType||'audio/webm';recorder=null;
  if(dur<400){busy=false;clearTempFace();say('Mantén pulsado el botón mientras hablas 🎤');scheduleMicRelease();return;}
  try{ensureAudio();const ab=await new Blob(chunks,{type}).arrayBuffer();const buf=await actx.decodeAudioData(ab);playVoice(buf);}
  catch(e){busy=false;clearTempFace();toast('No se ha podido reproducir la grabación');scheduleMicRelease();}
}
function scheduleMicRelease(){clearTimeout(micRelease);micRelease=setTimeout(()=>{if(micStream&&!recorder){micStream.getTracks().forEach(t=>t.stop());micStream=null;}},20000);}
function findBounds(buf){
  const d=buf.getChannelData(0);let peak=0;for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}
  if(peak<.02)return null;
  const thr=Math.max(.015,peak*.12);let s=0,e=d.length-1;
  while(s<d.length&&Math.abs(d[s])<thr)s++;while(e>s&&Math.abs(d[e])<thr)e--;
  return{start:Math.max(0,s/buf.sampleRate-.06),end:Math.min(buf.duration,e/buf.sampleRate+.15)};
}
function playVoice(buf){
  const v=VOICES.find(x=>x.id===S.voice)||VOICES[0],b=findBounds(buf);
  if(!b){busy=false;clearTempFace();say('No te he oído… ¿hablas más fuerte? 🤔');scheduleMicRelease();return;}
  const src=actx.createBufferSource();src.buffer=buf;src.playbackRate.value=v.rate;
  const an=actx.createAnalyser();an.fftSize=1024;const out=actx.createGain();out.gain.value=1.4;let osc=null;
  if(v.robot){const ring=actx.createGain();ring.gain.value=0;osc=actx.createOscillator();osc.frequency.value=60;osc.connect(ring.gain);src.connect(ring);ring.connect(an);osc.start();out.gain.value=2.4;}
  else src.connect(an);
  an.connect(out);out.connect(actx.destination);
  talking=true;setTempFace('talk');
  const data=new Float32Array(an.fftSize),mO=$('#mouthOpen');
  (function frame(){if(!talking)return;an.getFloatTimeDomainData(data);let s=0;for(let i=0;i<data.length;i++)s+=data[i]*data[i];
    mO.setAttribute('ry',(2+Math.min(12,Math.sqrt(s/data.length)*80)).toFixed(1));requestAnimationFrame(frame);})();
  src.onended=()=>{talking=false;if(osc)osc.stop();busy=false;S.stats.talks++;clearTempFace();funTouch();scheduleMicRelease();};
  src.start(0,b.start,b.end-b.start);
}

// animación: una fruta vuela de una caja a otra (la de llegada está oculta hasta que aterriza)
function flyFruit(e,from,fs,toSel,done){

  const fit=()=>{const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);};fit();
  const COLS=['#ff5252','#ffd23f','#69f0ae','#40c4ff','#e040fb','#ff9100','#ffffff'];
  const rockets=[],parts=[],conf=[];let last=performance.now(),acc=.2,run=true,booms=0;
  for(let i=0;i<(intense?90:45);i++)conf.push({x:Math.random()*W,y:-Math.random()*H,vy:60+Math.random()*90,vx:-20+Math.random()*40,r:Math.random()*6,vr:-4+Math.random()*8,w:6+Math.random()*6,h:3+Math.random()*4,c:pick(COLS),ph:Math.random()*6});
  const boom=(x,y)=>{const c=pick(COLS),c2=pick(COLS),n=intense?64:42;
    for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.1,v=110+Math.random()*150;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:i%3?c:c2});}
    if(booms++%2===0)noise(.4,{freq:220+Math.random()*260,vol:.16,type:'lowpass'});};
  function f(t){
    if(!run||!cv.isConnected)return;const dt=Math.min(.05,(t-last)/1000);last=t;
    if(innerWidth!==W||innerHeight!==H)fit();
    ctx.clearRect(0,0,W,H);acc-=dt;
    if(acc<=0){acc=intense?.5:1;rockets.push({x:W*(.12+Math.random()*.76),y:H+10,vy:-(H*.75+Math.random()*H*.25),ty:H*(.1+Math.random()*.3)});}
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;
      ctx.strokeStyle='rgba(255,230,160,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x,r.y+14);ctx.stroke();
      if(r.y<=r.ty){rockets.splice(i,1);boom(r.x,r.y);}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=150*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*.75;
      if(p.life<=0){parts.splice(i,1);continue;}ctx.globalAlpha=Math.min(1,p.life*1.4);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,6.3);ctx.fill();}
    ctx.globalAlpha=1;
    for(const c of conf){c.y+=c.vy*dt;c.x+=(c.vx+Math.sin(t/400+c.ph)*25)*dt;c.r+=c.vr*dt;if(c.y>H+12){c.y=-12;c.x=Math.random()*W;}
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.r*1.3))+1);ctx.restore();}
    requestAnimationFrame(f);
  }
  requestAnimationFrame(f);return()=>{run=false;};
}

function decay(m,floorOn){
  NEEDS.forEach(k=>{
    if(S.sleeping&&k==='energia'){S.needs.energia=clamp(S.needs.energia+20*m,0,100);return;}
    const d=DECAY[k]*m*(S.sleeping?.5:1),floor=floorOn?Math.min(S.needs[k],15):0;

function sfxW(n){try{ensureAudio();if(!actx||!S.sound)return;
  if(n==='whistle'){[0,.09,.18].forEach(a=>tone(2600,.07,{type:'square',vol:.05,at:a}));tone(2600,.35,{type:'square',vol:.05,at:.3});}
  else if(n==='kick'){tone(110,.12,{type:'sine',vol:.3,to:60});noise(.06,{freq:900,vol:.2});}
  else if(n==='cheer'){noise(1.4,{freq:1300,vol:.16,q:.6});noise(1.2,{freq:700,vol:.12,q:.5,at:.1});[0,.15,.3].forEach((a,i)=>tone(660+i*110,.18,{type:'triangle',vol:.06,at:a}));}
  else if(n==='aww'){tone(320,.7,{type:'sawtooth',vol:.05,to:190});noise(.8,{freq:500,vol:.08,q:.6});}
  else if(n==='net'){noise(.25,{freq:400,vol:.18,type:'lowpass'});}
  else if(n==='swish'){noise(.3,{freq:5000,vol:.12,type:'highpass'});}
  else if(n==='clonk'){tone(180,.2,{type:'square',vol:.08,to:120});tone(240,.15,{type:'triangle',vol:.06,at:.05});}
  else if(n==='buzzer'){tone(150,.9,{type:'sawtooth',vol:.12});}
  else if(n==='applause'||n==='applause2'){const L=n==='applause'?1.6:1;for(let i=0;i<(n==='applause'?46:28);i++)noise(.035,{freq:1400+Math.random()*2600,vol:.05+Math.random()*.09,at:Math.random()*L,q:1.4});noise(L,{freq:900,vol:.07,q:.4});if(n==='applause'){tone(520,.25,{type:'triangle',vol:.05,to:820,at:.05});tone(620,.3,{type:'triangle',vol:.04,to:900,at:.25});}}
  else if(n==='boo'||n==='boo2'){const L=n==='boo'?1.2:.8;[112,127,141,158].forEach((fr,i)=>tone(fr,L,{type:'sawtooth',vol:.035,to:fr*.82,at:i*.04}));noise(L,{freq:420,vol:.07,type:'lowpass'});}
}catch(e){}}

function stadiumResult(kind,mode,cs,valid,again,menu,extra){

  addXP(12);markDaily();save();updateUI();checkAchievements();

function startPenalty(mode){
  const g={id:'penalty',mode,saves:0,goals:0,shots:0,lock:true,q:null,opts:null,t0:0,over:false};game=g;
  openPanel(`<div class="ghead"><b>⚽ <span id="pnSc">🧤 0/${FUT_GOAL}</span></b><span class="clock" id="pnClk">⏱️ 0,00 s</span><button class="spk2" id="pnSay">🔊</button><button class="x" data-x>✕</button></div>
    <div class="stq" id="pnQ"></div>
    <div class="pnf" id="pnF">
      <div class="pnstands"></div>
      <div class="pngoal z6" id="pnG">${[0,1,2,3,4,5].map(i=>`<button class="pz" data-z="${i}"><span></span></button>`).join('')}</div>
      <div class="pnkeep" id="pnK"></div><div class="pnspot"></div><div class="pnkick" id="pnKick"></div>
      <div class="pnball" id="pnB">⚽</div><div class="pnmsg" id="pnM"></div>
    </div>`,'game',()=>{g.over=true;game=null;callar();openPenalty();});
  $$('#panel [data-x]').forEach(b=>b.onclick=()=>{g.over=true;game=null;callar();openPenalty();});
  const F=$('#pnF'),G=$('#pnG'),K=$('#pnK'),KI=$('#pnKick'),B=$('#pnB'),M=$('#pnM');
  K.innerHTML=petMini();KI.innerHTML=rivalSVG(false);
  const say=()=>{if(g.q)hablar(opVoz(g.q.h,g.q.a,g.q.b));};$('#pnSay').onclick=()=>hablarYa(say);
  const msg=(t,cls)=>{M.textContent=t;M.className='pnmsg show '+(cls||'');};
  const zoneC=i=>{const gr=G.getBoundingClientRect(),fr=F.getBoundingClientRect(),c=i%3,r=Math.floor(i/3);return{x:gr.left-fr.left+gr.width*(c+.5)/3,y:gr.top-fr.top+gr.height*(r+.5)/2,c};};
  function resetScene(){
    [K,B,KI].forEach(e=>e.style.transition='none');
    K.style.transform='translate(-50%,0)';B.style.left='50%';B.style.top='86%';B.style.transform='translate(-50%,-50%) scale(1)';B.style.opacity=1;
    G.classList.remove('shake');M.className='pnmsg';$$('#pnG .pz').forEach(z=>z.className='pz');
    void F.offsetWidth;[K,B,KI].forEach(e=>e.style.transition='');
  }
  function next(){
    if(game!==g||g.over)return;
    if(g.saves>=FUT_GOAL||g.shots>=FUT_MAXSHOTS){end();return;}
    resetScene();g.q=stFact();g.opts=choicesFor(g.q.res,6);
    $$('#pnG .pz').forEach((z,i)=>{z.querySelector('span').textContent=g.opts[i];});
    $('#pnQ').innerHTML=stQ(g.q,mode);say();g.lock=false;
  }
  function dive(i){const z=zoneC(i),kr=K.getBoundingClientRect(),fr=F.getBoundingClientRect();
    const dx=z.x-(kr.left-fr.left+kr.width/2),dy=z.y-(kr.top-fr.top+kr.height/2),rot=z.c===0?-60:z.c===2?60:0;
    K.style.transform=`translate(-50%,0) translate(${dx.toFixed(0)}px,${dy.toFixed(0)}px) rotate(${rot}deg) scale(.9)`;}
  function shoot(i,saved){sfxW('kick');const z=zoneC(i);
    B.style.left=z.x+'px';B.style.top=z.y+'px';B.style.transform='translate(-50%,-50%) scale(.62) rotate(540deg)';
    if(saved)setTimeout(()=>{if(game!==g)return;B.style.transition='left .5s ease-out,top .5s ease-in,transform .5s,opacity .5s';const s=z.c===2?1:-1;B.style.left=(z.x+s*80)+'px';B.style.top=(z.y+90)+'px';B.style.opacity=.15;},400);
    else setTimeout(()=>{if(game!==g)return;G.classList.add('shake');sfxW('net');},380);}
  function choose(i){
    if(g.lock||game!==g)return;g.lock=true;ensureAudio();
    const q=g.q,ci=g.opts.indexOf(q.res),ok=i===ci,zs=$$('#pnG .pz');g.shots++;
    zs[i].classList.add(ok?'ok':'bad');if(!ok)zs[ci].classList.add('ans');
    dive(i);setTimeout(()=>shoot(ci,ok),110);
    if(ok){g.saves++;S.fut.saves++;S.stats.ok=(S.stats.ok||0)+1;}else g.goals++;
    $('#pnQ').innerHTML=stQ(q,mode).replace('<span>?</span>',`<b class="pnans ${ok?'':'red'}">${q.res}</b>`);
    setTimeout(()=>{if(game!==g)return;$('#pnSc').textContent=`🧤 ${g.saves}/${FUT_GOAL}`;

  }

  sfxW('whistle');

    g.q=stFact();g.opts=choicesFor(g.q.res,3);

  }
  function fly(btn,ok){
    const cr=C.getBoundingClientRect(),br=btn.getBoundingClientRect(),rr=$('#bkRim').getBoundingClientRect();
    const s={x:br.left-cr.left+br.width/2,y:br.top-cr.top+br.height/2},e={x:rr.left-cr.left+rr.width/2+(ok?0:rr.width*.42),y:rr.top-cr.top+(ok?4:0)};
    const peak={x:(s.x+e.x)/2,y:Math.min(s.y,e.y)-cr.height*.28};
    const el=document.createElement('div');el.className='bkfly';el.textContent='🏀';C.appendChild(el);
    const T=650,t0=performance.now();
    const step=t=>{if(!el.isConnected)return;let u=Math.min(1,(t-t0)/T);
      const x=(1-u)*(1-u)*s.x+2*(1-u)*u*peak.x+u*u*e.x,y=(1-u)*(1-u)*s.y+2*(1-u)*u*peak.y+u*u*e.y;
      el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`translate(-50%,-50%) scale(${1-.4*u}) rotate(${u*400}deg)`;
      if(u<1){requestAnimationFrame(step);return;}
      if(ok){sfxW('swish');setTimeout(()=>sfxW('applause2'),120);$('#bkNet').classList.remove('swish');void C.offsetWidth;$('#bkNet').classList.add('swish');
        el.style.transition='top .35s ease-in,opacity .35s';el.style.top=(e.y+46)+'px';el.style.opacity=0;}
      else{sfxW('clonk');setTimeout(()=>sfxW('boo2'),150);el.style.transition='left .5s ease-out,top .5s ease-in,opacity .5s';el.style.left=(e.x+60)+'px';el.style.top=(e.y+90)+'px';el.style.opacity=0;}
      setTimeout(()=>el.remove(),600);};
    requestAnimationFrame(step);
  }
  const bkMsg=(t,c)=>{const m=$('#bkM');if(!m)return;m.textContent=t;m.className='bkmsg show '+c;setTimeout(()=>{if(m)m.className='bkmsg';},700);};
  $$('#bkBalls .bkb').forEach((b,i)=>b.onclick=()=>{
    if(g.lock||game!==g)return;g.lock=true;ensureAudio();
    const ok=g.opts[i]===g.q.res;b.classList.add(ok?'ok':'bad');b.querySelector('span').textContent='';
    fly(b,ok);

    else{g.errors++;const ci=g.opts.indexOf(g.q.res);$$('#bkBalls .bkb')[ci].classList.add('ans');
      setTimeout(()=>bkMsg('¡Clonk!','bad'),650);$('#bkQ').innerHTML=stQ(g.q,mode).replace('<span>?</span>',`<b class="pnans">${g.q.res}</b>`);
      hablar(opVoz(g.q.h,g.q.a,g.q.b)+', '+NUM[g.q.res]);setTimeout(q,2000);}
  });
  function end(){
    if(g.over)return;g.over=true;game=null;sfxW('buzzer');$$('.bkfly').forEach(x=>x.remove());
    const cs=Math.round((performance.now()-g.t0)/10),valid=g.hits>=BK_GOAL;
    setTimeout(()=>stadiumResult('bask',mode,cs,valid,()=>startBasket(mode),openBasket,[`🏀 Canastas: ${g.hits} · Fallos: ${g.errors}`]),700);
  }
  setTimeout(()=>{if(game!==g)return;g.t0=performance.now();runClock('#bkClk',g.t0,()=>game===g&&!g.over);q();},500);
}
